lity:visible"></line><line x1="0" y1="385" x2="750" y2="385" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="420" x2="750" y2="420" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="455" x2="750" y2="455" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="490" x2="750" y2="490" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="525" x2="750" y2="525" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="560" x2="750" y2="560" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="595" x2="750" y2="595" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="630" x2="750" y2="630" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="665" x2="750" y2="665" stroke="#294037" stroke-width=".7" style="visibility:visible"></line><line x1="0" y1="700" x2="750" y2="700" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="735" x2="750" y2="735" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="770" x2="750" y2="770" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="805" x2="750" y2="805" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="840" x2="750" y2="840" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="875" x2="750" y2="875" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="910" x2="750" y2="910" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="945" x2="750" y2="945" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="980" x2="750" y2="980" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="1015" x2="750" y2="1015" stroke="#294037" stroke-width=".7"></line><line x1="0" y1="1050" x2="750" y2="1050" stroke="#294037" stroke-width=".7"></line><text x="64" y="78" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>GREEN FUNCTION / FIELD NOTE 02</tspan></text><rect x="64" y="132" width="88" height="28" rx="14" fill="#3456F4"></rect><text x="108" y="152" fill="#FFFDF7" text-anchor="middle" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="13"><tspan>硬核入门</tspan></text><text x="64" y="203" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="61" text-anchor="start"><tspan x="64" dy="61"><tspan>如果宇宙</tspan></tspan><tspan x="64" dy="78"><tspan>只回复一次，</tspan></tspan></text><text x="64" y="367" fill="#C7FF3F" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="66" text-anchor="start"><tspan x="64" dy="66"><tspan>它会怎么回？</tspan></tspan></text><text x="64" y="490" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>格林函数：一种把复杂世界拆成无数次“喂”的方法。严</tspan></tspan><tspan x="64" dy="38"><tspan>谨地说，是点源响应；不严谨地说，是宇宙客服的标准话</tspan></tspan><tspan x="64" dy="38"><tspan>术。</tspan></tspan></text><rect x="64" y="672" width="622" height="124" rx="16" fill="#1B2E27" stroke="#C7FF3F" stroke-opacity=".35"></rect><text x="375" y="750" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="33"><tspan>Lₓ G(x, ξ) = δ(x − ξ)</tspan></text><circle cx="375" cy="900" r="8" fill="#C7FF3F"></circle><circle cx="375" cy="900" r="26" fill="none" stroke="#C7FF3F"></circle><circle cx="375" cy="900" r="51" fill="none" stroke="#C7FF3F"></circle><circle cx="375" cy="900" r="76" fill="none" stroke="#C7FF3F"></circle><circle cx="375" cy="900" r="101" fill="none" stroke="#C7FF3F"></circle><text x="375" y="1030" text-anchor="middle" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="12"><tspan>POINT SOURCE IN · WHOLE WORLD OUT</tspan></text></g><g><rect x="0" y="1060" width="750" height="1190" fill="#F4F0E6"></rect><text x="64" y="1149" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>00 / A QUESTION</tspan></text><text x="64" y="1188" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>先别急着求解。</tspan></tspan><tspan x="64" dy="57"><tspan>先把世界戳一下。</tspan></tspan></text><text x="64" y="1336" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>假设一块金属板正在被不均匀加热。常规做法是把热源 f(x) 整</tspan></tspan><tspan x="64" dy="38"><tspan>体塞进微分方程，然后开始一段双方都不太愉快的代数关系。</tspan></tspan></text><rect x="64" y="1446" width="622" height="110" rx="18" fill="#C7FF3F"></rect><path d="M92 1446 l16 -16 l16 16" fill="#C7FF3F"></path><text x="92" y="1446" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan x="92" dy="37"><tspan>格林函数换了一个问题：如果只在 ξ 处放一个总强度为 1</tspan></tspan><tspan x="92" dy="34"><tspan>的点源，系统在 x 处会怎么响应？</tspan></tspan></text><text x="64" y="1592" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>把这个响应记作 G(x,ξ)。系统若是线性的，任意复杂源都能拆</tspan></tspan><tspan x="64" dy="38"><tspan>成无数点源；总响应就是所有“标准回复”的加权叠加。</tspan></tspan></text><circle cx="375" cy="1904" r="34" fill="none" stroke="#A9B0A6" stroke-width="1.2"></circle><circle cx="375" cy="1904" r="73" fill="none" stroke="#A9B0A6" stroke-width="1.2"></circle><circle cx="375" cy="1904" r="112" fill="none" stroke="#A9B0A6" stroke-width="1.2"></circle><circle cx="375" cy="1904" r="151" fill="none" stroke="#A9B0A6" stroke-width="1.2"></circle><circle cx="375" cy="1904" r="190" fill="none" stroke="#A9B0A6" stroke-width="1.2"></circle><circle cx="375" cy="1904" r="9" fill="#3456F4"></circle><circle cx="375" cy="1904" r="22" fill="#3456F4"></circle><text x="399" y="1891" fill="#101510" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="13"><tspan>unit source ξ</tspan></text><text x="375" y="2141" text-anchor="middle" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18"><tspan>系统没有被“整体解决”，只是被逐点问了一遍。</tspan></text></g><g><rect x="0" y="2250" width="750" height="1151" fill="#101510"></rect><text x="64" y="2339" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>01 / THE DEFINITION</tspan></text><text x="64" y="2378" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>真正的定义：</tspan></tspan><tspan x="64" dy="57"><tspan>带边界条件的逆算子核</tspan></tspan></text><text x="64" y="2526" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>考虑线性方程 Lu=f。格林函数不是某个固定的 1/r，也不是物</tspan></tspan><tspan x="64" dy="38"><tspan>理学家祖传秘方；它由下面的方程定义：</tspan></tspan></text><rect x="64" y="2630" width="622" height="115" rx="14" fill="#20372E"></rect><rect x="64" y="2630" width="8" height="115" rx="4" fill="#C7FF3F"></rect><text x="98" y="2673" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="25"><tspan>Lₓ G(x, ξ) = δ(x − ξ)</tspan></text><text x="664" y="2727" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>DEFINITION</tspan></text><text x="64" y="2779" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>下标 x 表示算子作用在观察点 x 上；ξ 是源点。并且 G 必</tspan></tspan><tspan x="64" dy="38"><tspan>须满足原问题规定的边界条件。这个后半句经常被省略，然后边</tspan></tspan><tspan x="64" dy="38"><tspan>界条件会以扣分的形式重新出现。</tspan></tspan></text><rect x="64" y="2921" width="622" height="154" rx="14" fill="#C7FF3F"></rect><rect x="64" y="2921" width="8" height="154" rx="4" fill="#3456F4"></rect><text x="98" y="2964" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>u = L⁻¹f</tspan></text><text x="98" y="3003" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>u(x) = ∫Ω G(x,ξ) f(ξ) dξ  +  boundary term</tspan></text><text x="664" y="3057" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>OPERATOR → KERNEL</tspan></text><text x="64" y="3109" fill="#E8E3D7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>在线性代数中，(A⁻¹)ᵢⱼ 表示第 j 个自由度受到单位激励时</tspan></tspan><tspan x="64" dy="38"><tspan>，第 i 个自由度响应多少。G(x,ξ) 只是矩阵逆元连续化以后</tspan></tspan><tspan x="64" dy="38"><tspan>，开始用积分说话。</tspan></tspan></text><rect x="64" y="3251" width="622" height="76" rx="18" fill="#3456F4"></rect><path d="M92 3251 l16 -16 l16 16" fill="#3456F4"></path><text x="92" y="3251" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan x="92" dy="37"><tspan>不是魔法。只是矩阵逆穿上了无限维的外套。</tspan></tspan></text></g><g><rect x="0" y="3401" width="750" height="1194" fill="#F4F0E6"></rect><text x="64" y="3490" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>02 / WHY DELTA</tspan></text><text x="64" y="3529" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>δ 不是一根针。</tspan></tspan><tspan x="64" dy="57"><tspan>它是连续空间的单位基。</tspan></tspan></text><text x="64" y="3677" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>狄拉克 δ 不是普通函数，而是分布。它平时几乎处处为零，但</tspan></tspan><tspan x="64" dy="38"><tspan>一到积分环节就精准点名：</tspan></tspan></text><rect x="64" y="3781" width="622" height="154" rx="14" fill="#101510"></rect><rect x="64" y="3781" width="8" height="154" rx="4" fill="#C7FF3F"></rect><text x="98" y="3824" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>δ(x−ξ)=0,   x≠ξ</tspan></text><text x="98" y="3863" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>∫ δ(x−ξ) φ(x) dx = φ(ξ)</tspan></text><text x="664" y="3917" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>SAMPLING PROPERTY</tspan></text><text x="64" y="3971" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>离散向量可写成 f=Σⱼ fⱼeⱼ。连续函数的对应展开是：</tspan></tspan></text><rect x="64" y="4037" width="622" height="115" rx="14" fill="#E8E3D7"></rect><rect x="64" y="4037" width="8" height="115" rx="4" fill="#3456F4"></rect><text x="98" y="4080" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="25"><tspan>f(x) = ∫ f(ξ) δ(x−ξ) dξ</tspan></text><text x="664" y="4134" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>CONTINUOUS BASIS</tspan></text><text x="64" y="4186" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>现在把 L 作用到 ∫Gf 上，利用 LG=δ 与 δ 的筛选性质，</tspan></tspan><tspan x="64" dy="38"><tspan>就会严格得到 f(x)。所谓“卷积出答案”，不是直觉插队，而</tspan></tspan><tspan x="64" dy="38"><tspan>是证明已经把座位安排好了。</tspan></tspan></text><rect x="64" y="4328" width="622" height="193" rx="14" fill="#3456F4"></rect><rect x="64" y="4328" width="8" height="193" rx="4" fill="#C7FF3F"></rect><text x="98" y="4371" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>Lₓ ∫G(x,ξ)f(ξ)dξ</tspan></text><text x="98" y="4410" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>= ∫δ(x−ξ)f(ξ)dξ</tspan></text><text x="98" y="4449" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>= f(x)</tspan></text></g><g><rect x="0" y="4595" width="750" height="2276" fill="#F4F0E6"></rect><text x="64" y="4684" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>03 / DERIVE IT ONCE</tspan></text><text x="64" y="4723" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>一次完整推导：</tspan></tspan><tspan x="64" dy="57"><tspan>两端固定的一维问题</tspan></tspan></text><text x="64" y="4871" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>考虑 −u″(x)=f(x)，定义域 0&lt;x&lt;L，并规定 u(0)=u(L)=0。</tspan></tspan><tspan x="64" dy="38"><tspan>我们要找满足相同边界条件的 G：</tspan></tspan></text><rect x="64" y="4975" width="622" height="154" rx="14" fill="#101510"></rect><rect x="64" y="4975" width="8" height="154" rx="4" fill="#C7FF3F"></rect><text x="98" y="5018" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>−∂ₓ²G(x,ξ) = δ(x−ξ)</tspan></text><text x="98" y="5057" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>G(0,ξ)=G(L,ξ)=0</tspan></text><text x="664" y="5111" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>DIRICHLET PROBLEM</tspan></text><text x="64" y="5163" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>当 x≠ξ 时，右端为零，所以 G″=0。也就是说，G 在源点左</tspan></tspan><tspan x="64" dy="38"><tspan>右分别是一条直线。数学在这里表现得十分克制：出事地点之外</tspan></tspan><tspan x="64" dy="38"><tspan>，一切看起来都很正常。</tspan></tspan></text><rect x="64" y="5305" width="622" height="154" rx="14" fill="#E8E3D7"></rect><rect x="64" y="5305" width="8" height="154" rx="4" fill="#3456F4"></rect><text x="98" y="5348" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>G(x,ξ) = A(ξ)x+B(ξ),   x&lt;ξ</tspan></text><text x="98" y="5387" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>G(x,ξ) = C(ξ)x+D(ξ),   x&gt;ξ</tspan></text><text x="664" y="5441" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>HOMOGENEOUS ON BOTH SIDES</tspan></text><rect x="64" y="5489" width="622" height="330" rx="18" fill="#E5E9D1"></rect><line x1="102" y1="5709" x2="648" y2="5709" stroke="#101510" stroke-width="2"></line><line x1="102" y1="5709" x2="418.67999999999995" y2="5559" stroke="#3456F4" stroke-width="5" stroke-linecap="round"></line><line x1="418.67999999999995" y1="5559" x2="648" y2="5709" stroke="#3456F4" stroke-width="5" stroke-linecap="round"></line><line x1="418.67999999999995" y1="5534" x2="418.67999999999995" y2="5729" stroke="#FF5E55" stroke-width="1.5" stroke-dasharray="7 7"></line><circle cx="418.67999999999995" cy="5559" r="8" fill="#FF5E55"></circle><text x="102" y="5743" fill="#101510" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>0</tspan></text><text x="648" y="5743" text-anchor="end" fill="#101510" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>L</tspan></text><text x="418.67999999999995" y="5743" text-anchor="middle" fill="#FF5E55" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>ξ</tspan></text><text x="375" y="5784" text-anchor="middle" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="17"><tspan>G 连续；斜率跳一下。点源表示：这里发生过事。</tspan></text><text x="64" y="5853" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>G 本身必须连续，否则二阶导数中会冒出题目没有邀请的 δ′</tspan></tspan><tspan x="64" dy="38"><tspan>。但一阶导数必须跳跃：把方程在 ξ 附近积分，得到</tspan></tspan></text><rect x="64" y="5957" width="622" height="154" rx="14" fill="#101510"></rect><rect x="64" y="5957" width="8" height="154" rx="4" fill="#FF5E55"></rect><text x="98" y="6000" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>G(ξ⁻,ξ) = G(ξ⁺,ξ)</tspan></text><text x="98" y="6039" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>∂ₓG(ξ⁺,ξ) − ∂ₓG(ξ⁻,ξ) = −1</tspan></text><text x="64" y="6145" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>联立边界、连续和跳跃条件，最终得到：</tspan></tspan></text><rect x="64" y="6211" width="622" height="232" rx="14" fill="#C7FF3F"></rect><rect x="64" y="6211" width="8" height="232" rx="4" fill="#3456F4"></rect><text x="98" y="6254" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>G(x,ξ) = x(L−ξ)/L,    x≤ξ</tspan></text><text x="98" y="6293" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>G(x,ξ) = ξ(L−x)/L,    x≥ξ</tspan></text><text x="98" y="6332" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"></text><text x="98" y="6371" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>= min(x,ξ)[L−max(x,ξ)]/L</tspan></text><text x="664" y="6425" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>EXACT RESULT</tspan></text><text x="64" y="6477" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>于是 u(x)=∫₀ᴸG(x,ξ)f(ξ)dξ。整套构造被压缩成四个动</tspan></tspan><tspan x="64" dy="38"><tspan>作：</tspan></tspan></text><circle cx="72" cy="6596" r="5" fill="#3456F4"></circle><text x="92" y="6577" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="92" dy="21"><tspan>源点之外解齐次方程；</tspan></tspan></text><circle cx="72" cy="6646" r="5" fill="#3456F4"></circle><text x="92" y="6627" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="92" dy="21"><tspan>让 G 满足原边界条件；</tspan></tspan></text><circle cx="72" cy="6696" r="5" fill="#3456F4"></circle><text x="92" y="6677" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="92" dy="21"><tspan>在源点施加连续性与导数跳跃；</tspan></tspan></text><circle cx="72" cy="6746" r="5" fill="#3456F4"></circle><text x="92" y="6727" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="92" dy="21"><tspan>把所有点源按 f(ξ) 加权叠加。</tspan></tspan></text></g><g><rect x="0" y="6871" width="750" height="1653" fill="#F4F0E6"></rect><text x="64" y="6960" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>04 / WHY 1/R</tspan></text><text x="64" y="6999" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>三维自由空间：</tspan></tspan><tspan x="64" dy="57"><tspan>1/R 不是祖传经验</tspan></tspan></text><text x="64" y="7147" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>对 Poisson 算子，−∇²G(r,r′)=δ³(r−r′)。无界、均匀</tspan></tspan><tspan x="64" dy="38"><tspan>且各向同性意味着 G 只能依赖 R=|r−r′|。</tspan></tspan></text><rect x="64" y="7251" width="622" height="193" rx="14" fill="#E8E3D7"></rect><rect x="64" y="7251" width="8" height="193" rx="4" fill="#3456F4"></rect><text x="98" y="7294" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>R ≠ 0:</tspan></text><text x="98" y="7333" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>(1/R²) d/dR [R² dG/dR] = 0</tspan></text><text x="98" y="7372" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>⇒ G(R) = A + B/R</tspan></text><text x="664" y="7426" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>RADIAL LAPLACIAN</tspan></text><rect x="64" y="7476" width="622" height="360" rx="18" fill="#101510"></rect><circle cx="215" cy="7656" r="35" fill="none" stroke="#C7FF3F"></circle><circle cx="215" cy="7656" r="65" fill="none" stroke="#C7FF3F"></circle><circle cx="215" cy="7656" r="95" fill="none" stroke="#C7FF3F"></circle><line x1="215" y1="7656" x2="357" y2="7656" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="315.40916292848976" y2="7756.409162928489" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="215" y2="7798" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="114.59083707151026" y2="7756.409162928489" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="73" y2="7656" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="114.59083707151022" y2="7555.590837071511" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="214.99999999999997" y2="7514" stroke="#9FB3A5"></line><line x1="215" y1="7656" x2="315.4091629284897" y2="7555.590837071511" stroke="#9FB3A5"></line><circle cx="215" cy="7656" r="8" fill="#C7FF3F"></circle><text x="410" y="7601" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="33"><tspan>G(R) = 1/(4πR)</tspan></text><text x="410" y="7651" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18"><tspan>球面面积 ∝ R²</tspan></text><text x="410" y="7686" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18"><tspan>通量必须守恒</tspan></text><text x="410" y="7721" fill="#C7FF3F" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18"><tspan>所以场强 ∝ 1/R²</tspan></text><text x="410" y="7756" fill="#C7FF3F" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18"><tspan>势函数 ∝ 1/R</tspan></text><text x="64" y="7870" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>无穷远处衰减给出 A=0。再对包围源点的小球积分，利用 Gaus</tspan></tspan><tspan x="64" dy="38"><tspan>s 定理固定 B：</tspan></tspan></text><rect x="64" y="7974" width="622" height="193" rx="14" fill="#101510"></rect><rect x="64" y="7974" width="8" height="193" rx="4" fill="#C7FF3F"></rect><text x="98" y="8017" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>1 = −∫Bε ∇²G dV</tspan></text><text x="98" y="8056" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>= −∮∂Bε ∇G·n dS</tspan></text><text x="98" y="8095" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="23"><tspan>= 4πB</tspan></text><rect x="64" y="8197" width="622" height="115" rx="14" fill="#C7FF3F"></rect><rect x="64" y="8197" width="8" height="115" rx="4" fill="#3456F4"></rect><text x="98" y="8240" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="27"><tspan>G(r,r′) = 1 / [4π|r−r′|]</tspan></text><text x="664" y="8294" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>3D FREE SPACE</tspan></text><text x="64" y="8346" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>球面越大，单位面积分到的通量越少。这个逻辑比“背住 1/r”</tspan></tspan><tspan x="64" dy="38"><tspan>稍微费脑，但它不容易在考试结束后蒸发。</tspan></tspan></text></g><g><rect x="0" y="8524" width="750" height="1295" fill="#101510"></rect><text x="64" y="8613" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>05 / BOUNDARY IS DESTINY</tspan></text><text x="64" y="8652" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>同一个算子，</tspan></tspan><tspan x="64" dy="57"><tspan>为什么能有很多个 G？</tspan></tspan></text><text x="64" y="8800" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>因为格林函数由“算子 + 区域 + 边界/初始条件 + 因果约定”</tspan></tspan><tspan x="64" dy="38"><tspan>共同决定。边界条件不是附件，而是系统世界观。</tspan></tspan></text><rect x="64" y="8904" width="622" height="154" rx="14" fill="#20372E"></rect><rect x="64" y="8904" width="8" height="154" rx="4" fill="#C7FF3F"></rect><text x="98" y="8947" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>LG = δ  只规定奇点</tspan></text><text x="98" y="8986" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>boundary condition  选择具体解</tspan></text><text x="664" y="9040" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>NOT UNIQUE YET</tspan></text><text x="64" y="9092" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>以 Dirichlet 边界为例，选 G=0 于 ∂Ω。由 Green 第二恒</tspan></tspan><tspan x="64" dy="38"><tspan>等式可得</tspan></tspan></text><rect x="64" y="9196" width="622" height="154" rx="14" fill="#C7FF3F"></rect><rect x="64" y="9196" width="8" height="154" rx="4" fill="#3456F4"></rect><text x="98" y="9239" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>u(r) = ∫Ω G(r,r′) f(r′) dV′</tspan></text><text x="98" y="9278" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>− ∮∂Ω u(r′) ∂ₙ′G(r,r′) dS′</tspan></text><text x="64" y="9384" fill="#E8E3D7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>第一项来自体源，第二项来自边界。所以只写 u=∫Gf 有时相当</tspan></tspan><tspan x="64" dy="38"><tspan>于在合影里裁掉了边界，然后声称大家都到齐了。</tspan></tspan></text><rect x="64" y="9488" width="622" height="110" rx="18" fill="#3456F4"></rect><path d="M92 9488 l16 -16 l16 16" fill="#3456F4"></path><text x="92" y="9488" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan x="92" dy="37"><tspan>镜像法的本质：在自由空间基本解上加入齐次修正，让边界</tspan></tspan><tspan x="92" dy="34"><tspan>条件精确成立。镜像电荷只是数学演员，没有社保。</tspan></tspan></text><rect x="64" y="9630" width="622" height="115" rx="14" fill="#20372E"></rect><rect x="64" y="9630" width="8" height="115" rx="4" fill="#FF5E55"></rect><text x="98" y="9673" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>Gᴰ(r,r′) = (1/4π)[1/|r−r′| − 1/|r−r′*|]</tspan></text><text x="664" y="9727" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>G=0 ON GROUNDED PLANE</tspan></text></g><g><rect x="0" y="9819" width="750" height="1188" fill="#F4F0E6"></rect><text x="64" y="9908" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>06 / SPECTRAL VIEW</tspan></text><text x="64" y="9947" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>把所有允许模式，</tspan></tspan><tspan x="64" dy="57"><tspan>一次性装进 G 里</tspan></tspan></text><text x="64" y="10095" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>若 L 是自伴算子，且本征函数满足 Lφₙ=λₙφₙ、构成完</tspan></tspan><tspan x="64" dy="38"><tspan>备正交基，那么</tspan></tspan></text><rect x="64" y="10199" width="622" height="193" rx="14" fill="#101510"></rect><rect x="64" y="10199" width="8" height="193" rx="4" fill="#C7FF3F"></rect><text x="98" y="10242" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>Σₙ φₙ(x) φₙ*(ξ) = δ(x−ξ)</tspan></text><text x="98" y="10281" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"></text><text x="98" y="10320" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>G(x,ξ) = Σₙ φₙ(x)φₙ*(ξ) / λₙ</tspan></text><text x="664" y="10374" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>EIGENMODE EXPANSION</tspan></text><text x="64" y="10426" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>它把所有振动模、扩散模或量子态打包在一起，每个模式按 1/</tspan></tspan><tspan x="64" dy="38"><tspan>λₙ 加权。λₙ 越小，系统越容易沿那个模式被撬动。</tspan></tspan></text><rect x="64" y="10530" width="622" height="110" rx="18" fill="#E8E3D7"></rect><path d="M92 10530 l16 -16 l16 16" fill="#E8E3D7"></path><text x="92" y="10530" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan x="92" dy="37"><tspan>如果某个 λₙ=0，分母会发散。系统不是算坏了，而是在礼</tspan></tspan><tspan x="92" dy="34"><tspan>貌提醒：L 有零模，根本没有完整的逆。</tspan></tspan></text><text x="64" y="10674" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>平移不变时，傅里叶变换进一步把微分变成乘法：</tspan></tspan></text><rect x="64" y="10740" width="622" height="193" rx="14" fill="#3456F4"></rect><rect x="64" y="10740" width="8" height="193" rx="4" fill="#C7FF3F"></rect><text x="98" y="10783" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>L(∂ₓ)  →  L(ik)</tspan></text><text x="98" y="10822" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>G̃(k) = 1 / L(ik)</tspan></text><text x="98" y="10861" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>G(x) = ∫(dk/2π) eⁱᵏˣ / L(ik)</tspan></text><text x="664" y="10915" text-anchor="end" fill="#9FB3A5" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>DIFFERENTIAL → ALGEBRAIC</tspan></text></g><g><rect x="0" y="11007" width="750" height="1154" fill="#F4F0E6"></rect><text x="64" y="11096" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>07 / TIME &amp; CAUSALITY</tspan></text><text x="64" y="11135" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>时间进场后，</tspan></tspan><tspan x="64" dy="57"><tspan>还要规定谁先发生</tspan></tspan></text><text x="64" y="11283" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>对扩散方程 (∂ₜ−D∇²)u=f，延迟格林函数满足点时空源方程</tspan></tspan><tspan x="64" dy="38"><tspan>，并额外要求 Gᴿ=0（t&lt;t′）。这不是审美偏好，而是因果性</tspan></tspan><tspan x="64" dy="38"><tspan>。</tspan></tspan></text><rect x="64" y="11425" width="622" height="232" rx="14" fill="#101510"></rect><rect x="64" y="11425" width="8" height="232" rx="4" fill="#FF5E55"></rect><text x="98" y="11468" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>(∂ₜ−D∇²)Gᴿ</tspan></text><text x="98" y="11507" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>= δᵈ(r−r′)δ(t−t′)</tspan></text><text x="98" y="11546" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"></text><text x="98" y="11585" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22"><tspan>Gᴿ = 0,   t&lt;t′</tspan></text><text x="64" y="11691" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>在 d 维无界空间中，精确解是一团随时间展宽的高斯云：</tspan></tspan></text><rect x="64" y="11757" width="622" height="154" rx="14" fill="#C7FF3F"></rect><rect x="64" y="11757" width="8" height="154" rx="4" fill="#3456F4"></rect><text x="98" y="11800" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>Gᴿ = Θ(τ) exp[−R²/(4Dτ)] / (4πDτ)ᵈᐟ²</tspan></text><text x="98" y="11839" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan>τ=t−t′,   R=|r−r′|</tspan></text><text x="664" y="11893" text-anchor="end" fill="#3A5142" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="11"><tspan>DIFFUSION KERNEL</tspan></text><text x="64" y="11945" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>典型扩散长度 ℓ∼√(Dτ)。这意味着影响不是瞬间铺满宇宙，</tspan></tspan><tspan x="64" dy="38"><tspan>而是以平方根的速度扩大地盘——一种在赶 ddl 时显得过于从</tspan></tspan><tspan x="64" dy="38"><tspan>容的传播规律。</tspan></tspan></text></g><g><rect x="0" y="12161" width="750" height="1648" fill="#101510"></rect><text x="64" y="12250" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>08 / ENGINEERING</tspan></text><text x="64" y="12289" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>材料、电池与工程里，</tspan></tspan><tspan x="64" dy="57"><tspan>它到底在算什么？</tspan></tspan></text><text x="64" y="12437" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="22" text-anchor="start"><tspan x="64" dy="22"><tspan>格林函数真正的工程价值，是把“源在哪里”与“系统怎么传递</tspan></tspan><tspan x="64" dy="38"><tspan>影响”分开。前者放进 f，后者封装进 G。</tspan></tspan></text><rect x="64" y="12541" width="622" height="248" rx="18" fill="#20372E" stroke="#385347"></rect><text x="90" y="12580" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>01  热传导</tspan></text><text x="90" y="12632" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="25"><tspan>−∇·(k∇T)=q</tspan></text><text x="90" y="12660" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>每个微小发热点 q(r′)dV′，通过热格林函数贡献到测温点。几何、</tspan></tspan><tspan x="90" dy="31"><tspan>散热边界和界面条件都藏在 G 里。</tspan></tspan></text><rect x="64" y="12809" width="622" height="248" rx="18" fill="#20372E" stroke="#385347"></rect><text x="90" y="12848" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>02  锂离子扩散</tspan></text><text x="90" y="12900" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="25"><tspan>∂ₜc=Dₛ∇²c+s</tspan></text><text x="90" y="12928" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>一次局部嵌锂事件如何在颗粒中扩散；任意充放电历史则是过去所有脉</tspan></tspan><tspan x="90" dy="31"><tspan>冲响应的总和。</tspan></tspan></text><rect x="64" y="13077" width="622" height="248" rx="18" fill="#20372E" stroke="#385347"></rect><text x="90" y="13116" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>03  弹性缺陷</tspan></text><text x="90" y="13168" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="25"><tspan>Lᵢⱼuⱼ=fᵢ</tspan></text><text x="90" y="13196" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>张量 Gᵢⱼ 表示 j 方向单位点力在 i 方向造成的位移。裂纹、位错</tspan></tspan><tspan x="90" dy="31"><tspan>和夹杂都能被组织成“缺陷源 × G”。</tspan></tspan></text><rect x="64" y="13345" width="622" height="248" rx="18" fill="#20372E" stroke="#385347"></rect><text x="90" y="13384" fill="#C7FF3F" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>04  电子结构</tspan></text><text x="90" y="13436" fill="#FFFDF7" font-family="&#x27;Noto Sans SC&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="25"><tspan>Gᴿ(E)=[E−H+i0⁺]⁻¹</tspan></text><text x="90" y="13464" fill="#9FB3A5" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>极点记录能谱，虚部连接态密度：ρ(r,E)=−Im Gᴿ(r,r;E)/π。这</tspan></tspan><tspan x="90" dy="31"><tspan>里的 G 已经开始替实验讲悄悄话。</tspan></tspan></text><rect x="64" y="13625" width="622" height="110" rx="18" fill="#C7FF3F"></rect><path d="M92 13625 l16 -16 l16 16" fill="#C7FF3F"></path><text x="92" y="13625" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21"><tspan x="92" dy="37"><tspan>一句话：G 负责系统，f 负责事故现场。二者卷积以后，工</tspan></tspan><tspan x="92" dy="34"><tspan>程师负责写报告。</tspan></tspan></text></g><g><rect x="0" y="13809" width="750" height="1142" fill="#F4F0E6"></rect><text x="64" y="13898" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>09 / DO NOT PANIC</tspan></text><text x="64" y="13937" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>四个常见误区，</tspan></tspan><tspan x="64" dy="57"><tspan>以及它们的善后方案</tspan></tspan></text><rect x="64" y="14085" width="622" height="180" rx="16" fill="#E8E3D7"></rect><text x="90" y="14129" fill="#3456F4" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="20"><tspan>误区 1｜G 只由微分方程决定</tspan></text><text x="90" y="14155" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>应为：算子 + 区域 + 边界/初始条件 + 因果约定。</tspan></tspan></text><rect x="64" y="14283" width="622" height="180" rx="16" fill="#E3E9FC"></rect><text x="90" y="14327" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="20"><tspan>误区 2｜G 是处处良好的普通函数</tspan></text><text x="90" y="14353" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>源点处通常奇异，LG=δ 必须在分布意义下理解。</tspan></tspan></text><rect x="64" y="14481" width="622" height="180" rx="16" fill="#E8E3D7"></rect><text x="90" y="14525" fill="#3456F4" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="20"><tspan>误区 3｜写出 ∫Gf 就自动结束</tspan></text><text x="90" y="14551" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>非齐次边界一般还贡献边界积分项。边界没有下班。</tspan></tspan></text><rect x="64" y="14679" width="622" height="180" rx="16" fill="#E3E9FC"></rect><text x="90" y="14723" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="20"><tspan>误区 4｜G 天然满足 G(x,ξ)=G(ξ,x)</tspan></text><text x="90" y="14749" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="18" text-anchor="start"><tspan x="90" dy="18"><tspan>对称性通常依赖自伴算子与相容边界；非自伴、耗散或不同因果选择下</tspan></tspan><tspan x="90" dy="31"><tspan>可能失效。</tspan></tspan></text></g><g><rect x="0" y="14951" width="750" height="1286" fill="#F4F0E6"></rect><text x="64" y="15040" fill="#3456F4" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="14"><tspan>10 / THE ROUTE</tspan></text><text x="64" y="15079" fill="#101510" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial Black&#x27;,sans-serif" font-size="44" text-anchor="start"><tspan x="64" dy="44"><tspan>下次再遇到 Lu=f，</tspan></tspan><tspan x="64" dy="57"><tspan>按这条路线走</tspan></tspan></text><circle cx="91" cy="15257" r="27" fill="#3456F4"></circle><text x="91" y="15265" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="18"><tspan>1</tspan></text><text x="140" y="15230" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="140" dy="21"><tspan>明确区域、边界条件、初始条件与因果约定；</tspan></tspan></text><line x1="91" y1="15284" x2="91" y2="15307" stroke="#CBD0C6" stroke-width="2"></line><circle cx="91" cy="15339" r="27" fill="#3456F4"></circle><text x="91" y="15347" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="18"><tspan>2</tspan></text><text x="140" y="15312" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="140" dy="21"><tspan>定义 LₓG(x,ξ)=δ(x−ξ)；</tspan></tspan></text><line x1="91" y1="15366" x2="91" y2="15389" stroke="#CBD0C6" stroke-width="2"></line><circle cx="91" cy="15421" r="27" fill="#3456F4"></circle><text x="91" y="15429" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="18"><tspan>3</tspan></text><text x="140" y="15394" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="140" dy="21"><tspan>在 x≠ξ 处求齐次解；</tspan></tspan></text><line x1="91" y1="15448" x2="91" y2="15471" stroke="#CBD0C6" stroke-width="2"></line><circle cx="91" cy="15503" r="27" fill="#3456F4"></circle><text x="91" y="15511" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="18"><tspan>4</tspan></text><text x="140" y="15476" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="140" dy="21"><tspan>用边界条件选择正确的齐次修正；</tspan></tspan></text><line x1="91" y1="15530" x2="91" y2="15553" stroke="#CBD0C6" stroke-width="2"></line><circle cx="91" cy="15585" r="27" fill="#3456F4"></circle><text x="91" y="15593" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="18"><tspan>5</tspan></text><text x="140" y="15558" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="140" dy="21"><tspan>用连续性与跳跃条件固定源点奇性；</tspan></tspan></text><line x1="91" y1="15612" x2="91" y2="15635" stroke="#CBD0C6" stroke-width="2"></line><circle cx="91" cy="15667" r="27" fill="#3456F4"></circle><text x="91" y="15675" text-anchor="middle" fill="#FFFDF7" font-family="&#x27;Cascadia Mono&#x27;,&#x27;JetBrains Mono&#x27;,&#x27;SFMono-Regular&#x27;,&#x27;Consolas&#x27;,monospace" font-size="18"><tspan>6</tspan></text><text x="140" y="15640" fill="#3A5142" font-family="&#x27;Noto Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Arial&#x27;,sans-serif" font-size="21" text-anchor="start"><tspan x="14
